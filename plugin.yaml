name: session-mirror
version: "0.5.0"
description: >-
  Mirrors Hermes Desktop / CLI conversations into Discord: one public thread per session in a
  channel you choose, one post per turn (your message + the reply). Secrets are redacted before
  anything leaves the machine. Never blocks a turn: posting runs on a background thread.
author: rrrrnmtsu
requires_hermes: ">=0.21"
provides_hooks:
  - post_llm_call
config_schema:
  enabled:
    type: bool
    label: Enable
    description: Master switch. false = nothing is posted.
    default: true
  channel_id:
    type: str
    label: Parent channel id
    description: Text channel that will hold one thread per session. Required. Numeric YAML values are fine (coerced to string); the "should be str (got int)" warning is harmless.
    default: ""
  paused:
    type: bool
    label: Pause
    description: true = stop posting (re-read every 60 s, no restart needed).
    default: false
  platforms:
    type: str
    label: Mirrored platforms
    description: Comma-separated platforms to mirror (case-insensitive). "discord" is never mirrored; one-shot runs (hermes -z / chat -q) are always skipped.
    default: "desktop,cli,acp,tui"
  token_secret:
    type: str
    label: Bot token secret name
    description: Name looked up via agent.secret_scope, which falls back to the process environment when profiles are not multiplexed.
    default: "DISCORD_BOT_TOKEN"
  max_chars:
    type: int
    label: Max chars per side
    description: Each user / assistant body is truncated to this many characters. 0 or negative = unlimited.
    default: 6000
